<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tactical Voxel Sweeper 3D</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js (r128) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=M+PLUS+Rounded+1c:wght@500;700;800&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      overflow: hidden;
    }
    .font-title {
      font-family: 'Cinzel', serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 w-screen h-screen relative select-none overflow-hidden">

  <!-- 3D WebGL Canvas Container -->
  <div id="canvas-container" class="absolute inset-0 w-full h-full cursor-crosshair"></div>

  <!-- Observation Floating Banner (ゲーム終了後の答え合わせ用) -->
  <div id="observe-banner" class="absolute top-3 left-1/2 -translate-x-1/2 pointer-events-none transition-all duration-300 opacity-0 -translate-y-4 z-20 flex items-center gap-2 bg-slate-900/90 backdrop-blur-md border border-amber-500/50 px-4 py-2 rounded-2xl shadow-2xl">
    <span class="text-xs font-bold text-amber-300 flex items-center gap-1.5">
      <span class="animate-pulse">🔍</span> 盤面観察・答え合わせ中
    </span>
    <button id="btn-return-modal" class="pointer-events-auto ml-2 px-3 py-1 bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 text-slate-950 text-xs font-black rounded-xl shadow active:scale-95 transition-all">
      結果 / 次へ ➔
    </button>
  </div>

  <!-- Top Navigation & Status Bar -->
  <header class="absolute top-0 left-0 right-0 p-2 sm:p-3 pointer-events-none flex flex-col gap-2 z-10">
    <div class="flex items-center justify-between gap-2 max-w-5xl mx-auto w-full">
      <!-- Title & Rule Badge -->
      <div class="pointer-events-auto bg-slate-900/90 backdrop-blur-md border border-amber-500/30 px-3 py-1.5 rounded-2xl shadow-xl flex items-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping"></div>
        <div>
          <h1 class="text-xs sm:text-sm font-black tracking-wider text-amber-300 font-title uppercase">Tactical Voxel</h1>
          <span class="text-[9px] text-cyan-400 font-bold">立体26近傍探知</span>
        </div>
      </div>

      <!-- Quick View Controls (Angle, X-Ray, Zoom) -->
      <div class="pointer-events-auto flex items-center gap-1 bg-slate-900/90 backdrop-blur-md border border-slate-700/70 px-2 py-1 rounded-2xl shadow-xl text-xs">
        <!-- 視点アングル切替 -->
        <button id="btn-pitch" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 active:scale-95 text-cyan-300 font-bold rounded-lg transition-all flex items-center gap-1 border border-slate-700" title="俯瞰アングル切替 (Pキー)">
          <span>📐</span>
          <span id="pitch-label" class="text-[10px] hidden sm:inline">標準 (35°)</span>
        </button>
        <!-- 透視モード切替 -->
        <button id="btn-xray" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 active:scale-95 text-purple-300 font-bold rounded-lg transition-all flex items-center gap-1 border border-slate-700" title="透視モード切替 (Xキー)">
          <span>👁️</span>
          <span id="xray-label" class="text-[10px] hidden sm:inline">透視 OFF</span>
        </button>
        <!-- ズームコントロール -->
        <div class="flex items-center bg-slate-800 border border-slate-700 rounded-lg overflow-hidden ml-0.5">
          <button id="btn-zoom-out" class="px-1.5 py-1 hover:bg-slate-700 active:scale-95 text-slate-300 font-mono font-bold text-xs" title="縮小">−</button>
          <button id="btn-zoom-reset" class="px-1.5 py-1 hover:bg-slate-700 text-[10px] text-amber-400 font-mono font-bold" title="リセット">1.0x</button>
          <button id="btn-zoom-in" class="px-1.5 py-1 hover:bg-slate-700 active:scale-95 text-slate-300 font-mono font-bold text-xs" title="拡大">＋</button>
        </div>
      </div>

      <!-- Status Counters & Reset -->
      <div class="pointer-events-auto flex items-center gap-2 bg-slate-900/90 backdrop-blur-md border border-slate-700/70 px-3 py-1.5 rounded-2xl shadow-xl text-xs">
        <!-- 残地雷数 -->
        <div class="flex items-center gap-1">
          <span class="text-rose-400 font-bold text-[11px]">💣</span>
          <span id="mine-counter" class="font-mono font-extrabold text-rose-300 w-7 text-center bg-rose-950/60 border border-rose-800/50 rounded px-0.5 text-xs">00</span>
        </div>
        <div class="h-3 w-[1px] bg-slate-700"></div>
        <!-- 経過タイマー -->
        <div class="flex items-center gap-1">
          <span class="text-cyan-400 font-bold text-[11px]">⏱</span>
          <span id="timer-display" class="font-mono font-extrabold text-cyan-300 w-11 text-center bg-cyan-950/60 border border-cyan-800/50 rounded px-0.5 text-xs">00:00</span>
        </div>
        <div class="h-3 w-[1px] bg-slate-700"></div>
        <!-- 再生成ボタン -->
        <button id="btn-reset" class="px-2 py-1 bg-amber-600/90 hover:bg-amber-500 text-white text-[11px] font-bold rounded-lg transition-all active:scale-95 shadow flex items-center gap-1" title="地形再生成">
          <span>🔄</span>
        </button>
      </div>
    </div>
  </header>
  <!-- Bottom Control Panel & Mode Switcher -->
  <footer class="absolute bottom-2.5 sm:bottom-4 left-0 right-0 px-3 pointer-events-none flex flex-col items-center gap-2 z-10">
    <div class="pointer-events-auto bg-slate-900/90 backdrop-blur-md border border-slate-700/80 p-1.5 rounded-2xl shadow-2xl flex items-center justify-center gap-2 max-w-sm sm:max-w-md w-full">
      <!-- 左旋回 -->
      <button id="btn-rot-left" class="p-2 sm:px-3 sm:py-2 bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-600/50 rounded-xl text-xs font-bold text-slate-200 transition-all flex items-center gap-1 shadow" title="左へ90度旋回 (A/←)">
        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 15l-3-3m0 0l3-3m-3 3h8M3 12a9 9 0 1118 0 9 9 0 01-18 0z"/></svg>
        <span class="hidden sm:inline">左旋回</span>
      </button>

      <!-- 調査（掘る）モード -->
      <button id="btn-mode-dig" class="flex-1 py-2 px-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1 transition-all shadow-lg ring-2 ring-emerald-500 bg-emerald-600 text-white">
        <span>⛏️ 調査</span>
      </button>

      <!-- 旗立てモード -->
      <button id="btn-mode-flag" class="flex-1 py-2 px-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1 transition-all bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">
        <span>🚩 旗立て</span>
      </button>

      <!-- 右旋回 -->
      <button id="btn-rot-right" class="p-2 sm:px-3 sm:py-2 bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-600/50 rounded-xl text-xs font-bold text-slate-200 transition-all flex items-center gap-1 shadow" title="右へ90度旋回 (D/→)">
        <span class="hidden sm:inline">右旋回</span>
        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 9l3 3m0 0l-3 3m3-3H8m13 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </button>
    </div>

    <!-- 地形規模・難易度セレクター -->
    <div class="pointer-events-auto flex items-center justify-center gap-1 text-[10px] sm:text-[11px] text-slate-400 bg-slate-950/80 backdrop-blur-sm px-3 py-1 rounded-full border border-slate-800">
      <span class="text-slate-500">規模:</span>
      <button class="diff-btn text-slate-400 font-bold px-1.5 py-0.5 rounded hover:bg-slate-800 transition-colors" data-size="6" data-height="3" data-mines="6">6x6</button>
      <span class="text-slate-700">|</span>
      <button class="diff-btn text-amber-400 font-bold px-1.5 py-0.5 rounded hover:bg-slate-800 transition-colors" data-size="8" data-height="5" data-mines="14">8x8</button>
      <span class="text-slate-700">|</span>
      <button class="diff-btn text-slate-400 font-bold px-1.5 py-0.5 rounded hover:bg-slate-800 transition-colors" data-size="10" data-height="6" data-mines="26">10x10</button>
      <span class="text-slate-700">|</span>
      <button class="diff-btn text-slate-400 font-bold px-1.5 py-0.5 rounded hover:bg-slate-800 transition-colors" data-size="12" data-height="7" data-mines="42">12x12</button>
      <span class="text-slate-700">|</span>
      <button class="diff-btn text-slate-400 font-bold px-1.5 py-0.5 rounded hover:bg-slate-800 transition-colors" data-size="14" data-height="8" data-mines="64">14x14</button>
    </div>
  </footer>
  <!-- Result Modal: Victory / Game Over -->
  <div id="game-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity duration-300 opacity-0 pointer-events-none">
    <div class="bg-slate-900 border-2 border-amber-500/50 p-6 sm:p-7 rounded-3xl max-w-sm w-11/12 text-center shadow-2xl transform scale-95 transition-transform duration-300" id="modal-box">
      <div id="modal-icon" class="text-5xl mb-2 animate-bounce">🏆</div>
      <h2 id="modal-title" class="text-xl sm:text-2xl font-black text-amber-300 mb-1 font-title">TACTICAL CLEAR!</h2>
      <p id="modal-desc" class="text-xs text-slate-300 mb-4 leading-relaxed">立体地形のすべての地雷を安全に特定しました！</p>
      
      <!-- 統計内訳 -->
      <div class="bg-slate-950/70 p-3 rounded-xl border border-slate-800 mb-4 grid grid-cols-3 gap-1">
        <div>
          <div class="text-[9px] text-slate-400">クリアタイム</div>
          <div id="modal-time" class="text-xs sm:text-sm font-mono font-bold text-cyan-300">01:24</div>
        </div>
        <div>
          <div class="text-[9px] text-emerald-400">正解フラグ</div>
          <div id="modal-correct-flags" class="text-xs sm:text-sm font-mono font-bold text-emerald-300">14/14</div>
        </div>
        <div>
          <div class="text-[9px] text-rose-400">誤フラグ</div>
          <div id="modal-wrong-flags" class="text-xs sm:text-sm font-mono font-bold text-rose-400">0</div>
        </div>
      </div>

      <!-- アクションボタン -->
      <div class="flex flex-col gap-2">
        <button id="modal-restart-btn" class="w-full py-2.5 bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 text-slate-950 font-black rounded-xl shadow-lg active:scale-95 transition-all text-xs uppercase tracking-wider">
          次のマップへ出撃 (🔄)
        </button>
        <button id="modal-observe-btn" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold rounded-xl border border-slate-700 active:scale-95 transition-all text-xs flex items-center justify-center gap-1.5">
          <span>🔍</span> 盤面を観察する (答え合わせ)
        </button>
      </div>
    </div>
  </div>
  <script>
    /* ==========================================================================
       1. 音響シンセサイザー (Web Audio API)
       ========================================================================== */
    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playDig() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(360, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }
      playFlag() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(560, this.ctx.currentTime);
        osc.frequency.setValueAtTime(840, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }
      playRotate() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(260, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(520, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
      playExplode() {
        this.init();
        const bufSize = this.ctx.sampleRate * 0.55;
        const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buf;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(450, this.ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(25, this.ctx.currentTime + 0.5);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.45, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.55);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
      }
      playWin() {
        this.init();
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.1);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.1 + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.1);
          osc.stop(this.ctx.currentTime + idx * 0.1 + 0.35);
        });
      }
    }
    const sfx = new SoundFX();
    /* ==========================================================================
       2. 高解像度・高コントラスト テクスチャキャッシュ
       ========================================================================== */
    const textureCache = {
      numbers: {},
      flag: null,
      correctFlag: null,
      wrongFlag: null,
      bomb: null,
      explodedBomb: null,
      unrevealedTop: null,
      unrevealedSide: null,
      stoneBlank: null
    };

    // 1〜26までの全数字に対応した高輝度ネオンパレット
    const numberColors = [
      '#94a3b8', // 0
      '#38bdf8', // 1 (蛍光シアン)
      '#4ade80', // 2 (ライムグリーン)
      '#f87171', // 3 (鮮烈レッド)
      '#c084fc', // 4 (ネオンパープル)
      '#fbbf24', // 5 (鮮明アンバー)
      '#2dd4bf', // 6 (エメラルドティール)
      '#fb7185', // 7 (ホットピンク)
      '#ffffff', // 8 (ピュアホワイト)
      '#f97316', // 9 (ネオンオレンジ)
      '#e11d48', // 10 (ディープローズ)
      '#06b6d4', // 11 (ディープシアン)
      '#84cc16', // 12 (シャープライム)
      '#a855f7', // 13 (マゼンタパープル)
      '#eab308', // 14 (ゴールド)
      '#10b981'  // 15+ (ミントグリーン)
    ];

    function getNumberColor(num) {
      if (num < numberColors.length) return numberColors[num];
      return '#38bdf8';
    }

    // 未開封ブロック（草地天面）テクスチャ
    function getUnrevealedTopTexture() {
      if (textureCache.unrevealedTop) return textureCache.unrevealedTop;
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#1e3a1b';
      ctx.fillRect(0, 0, 128, 128);
      ctx.fillStyle = '#2d5a27';
      ctx.fillRect(8, 8, 112, 112);
      ctx.fillStyle = '#3a7332';
      ctx.fillRect(16, 16, 96, 96);
      ctx.strokeStyle = '#529648';
      ctx.lineWidth = 4;
      ctx.strokeRect(18, 18, 92, 92);
      const tex = new THREE.CanvasTexture(canvas);
      textureCache.unrevealedTop = tex;
      return tex;
    }

    // 未開封ブロック（土壁側面）テクスチャ
    function getUnrevealedSideTexture() {
      if (textureCache.unrevealedSide) return textureCache.unrevealedSide;
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#271911';
      ctx.fillRect(0, 0, 128, 128);
      ctx.fillStyle = '#452b1e';
      ctx.fillRect(6, 6, 116, 116);
      ctx.fillStyle = '#2d5a27';
      ctx.fillRect(6, 6, 116, 20); // 上部の草冠
      ctx.strokeStyle = '#5a3d2e';
      ctx.lineWidth = 4;
      ctx.strokeRect(8, 8, 112, 112);
      const tex = new THREE.CanvasTexture(canvas);
      textureCache.unrevealedSide = tex;
      return tex;
    }
    // 🌟 1桁・2桁（9〜26）に自動対応する超高解像度(256x256)数字テクスチャ 🌟
    function getNumberTexture(num) {
      if (textureCache.numbers[num]) return textureCache.numbers[num];

      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // 背景の深色石畳プレート
      ctx.fillStyle = '#060913';
      ctx.fillRect(0, 0, 256, 256);
      ctx.fillStyle = '#111827';
      ctx.fillRect(10, 10, 236, 236);
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 8;
      ctx.strokeRect(14, 14, 228, 228);

      if (num > 0) {
        // 中央のダークバッジ（数字可読性シャドウ）
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.beginPath();
        ctx.arc(128, 128, 92, 0, Math.PI * 2);
        ctx.fill();

        // 🌟 2桁数字（10以上）のはみ出し防止：桁数に応じてフォントサイズを動的調整 🌟
        const isTwoDigit = num >= 10;
        const fontSize = isTwoDigit ? 96 : 148;
        ctx.font = `900 ${fontSize}px "JetBrains Mono", "Arial Black", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const color = getNumberColor(num);
        const yPos = isTwoDigit ? 132 : 134;

        // 1. 極太ブラックアウトライン (二重境界線)
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = isTwoDigit ? 20 : 26;
        ctx.lineJoin = 'round';
        ctx.strokeText(num.toString(), 128, yPos);

        // 2. グロー光沢
        ctx.shadowColor = color;
        ctx.shadowBlur = 14;

        // 3. メインの数字塗りつぶし
        ctx.fillStyle = color;
        ctx.fillText(num.toString(), 128, yPos);

        // 4. ホワイトインセットハイライト
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = 3;
        ctx.strokeText(num.toString(), 128, yPos);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.generateMipmaps = true;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      textureCache.numbers[num] = tex;
      return tex;
    }
    // ベクターフラグテクスチャ生成
    function createVectorFlagTexture(bgColor, borderColor, subIcon) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, 256, 256);
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 14;
      ctx.strokeRect(10, 10, 236, 236);

      // ポール
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 12;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(85, 45);
      ctx.lineTo(85, 215);
      ctx.stroke();

      // 三角フラッグ
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(85, 55);
      ctx.lineTo(195, 95);
      ctx.lineTo(85, 135);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#7f1d1d';
      ctx.lineWidth = 6;
      ctx.stroke();

      // サブアイコン (正解 ✅ / 誤り ❌)
      if (subIcon === 'check') {
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 20;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(125, 185);
        ctx.lineTo(155, 215);
        ctx.lineTo(215, 155);
        ctx.stroke();
      } else if (subIcon === 'cross') {
        ctx.strokeStyle = '#f43f5e';
        ctx.lineWidth = 20;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(135, 155);
        ctx.lineTo(205, 225);
        ctx.moveTo(205, 155);
        ctx.lineTo(135, 225);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.generateMipmaps = true;
      return tex;
    }

    function getFlagTexture() {
      if (!textureCache.flag) textureCache.flag = createVectorFlagTexture('#064e3b', '#10b981', null);
      return textureCache.flag;
    }
    function getCorrectFlagTexture() {
      if (!textureCache.correctFlag) textureCache.correctFlag = createVectorFlagTexture('#064e3b', '#22c55e', 'check');
      return textureCache.correctFlag;
    }
    function getWrongFlagTexture() {
      if (!textureCache.wrongFlag) textureCache.wrongFlag = createVectorFlagTexture('#4c0519', '#e11d48', 'cross');
      return textureCache.wrongFlag;
    }

    // 地雷テクスチャ生成
    function createVectorBombTexture(isExploded) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = isExploded ? '#991b1b' : '#3f0c10';
      ctx.fillRect(0, 0, 256, 256);
      ctx.strokeStyle = isExploded ? '#ef4444' : '#b91c1c';
      ctx.lineWidth = 14;
      ctx.strokeRect(10, 10, 236, 236);

      // 地雷本体（黒丸）
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(128, 138, 70, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 8;
      ctx.stroke();

      // スパイク針
      for (let i = 0; i < 8; i++) {
        const rad = (i * Math.PI) / 4;
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(128 + Math.cos(rad) * 60, 138 + Math.sin(rad) * 60);
        ctx.lineTo(128 + Math.cos(rad) * 95, 138 + Math.sin(rad) * 95);
        ctx.stroke();
      }

      // ハイライト
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(106, 116, 14, 0, Math.PI * 2);
      ctx.fill();

      if (isExploded) {
        // 爆発マーク
        ctx.fillStyle = '#fbbf24';
        ctx.font = '900 64px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('💥', 128, 70);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.generateMipmaps = true;
      return tex;
    }

    function getBombTexture(exploded = false) {
      if (exploded) {
        if (!textureCache.explodedBomb) textureCache.explodedBomb = createVectorBombTexture(true);
        return textureCache.explodedBomb;
      }
      if (!textureCache.bomb) textureCache.bomb = createVectorBombTexture(false);
      return textureCache.bomb;
    }
    /* ==========================================================================
       3. 3D Isometric Engine (立体26近傍 & 全方位テクスチャ対応)
       ========================================================================== */
    class VoxelMinesweeperGame {
      constructor() {
        this.container = document.getElementById('canvas-container');
        this.width = this.container.clientWidth || window.innerWidth;
        this.height = this.container.clientHeight || window.innerHeight;

        // 設定
        this.gridSize = 8;
        this.maxHeight = 5;
        this.activeMines = 14;

        // 状態
        this.board = []; // [x][y][z]
        this.activeBlocks = []; // 探索対象のブロック配列
        this.allMeshes = [];

        this.isFirstClick = true;
        this.isGameOver = false;
        this.isGameWon = false;
        this.currentMode = 'dig';
        this.flagsPlaced = 0;
        this.revealedCount = 0;
        this.totalSafeBlocks = 0;

        // 視点アングル・透視・ズーム
        this.pitchAngles = [
          { name: '標準 (35°)', pitch: Math.atan(1 / Math.sqrt(2)) },
          { name: '急斜 (55°)', pitch: 55 * (Math.PI / 180) },
          { name: '真上 (80°)', pitch: 80 * (Math.PI / 180) }
        ];
        this.pitchIndex = 0;
        this.isXRayActive = false;
        this.zoomFactor = 1.0;

        // カメラ旋回
        this.targetRotationY = Math.PI / 4;
        this.currentRotationY = Math.PI / 4;
        this.cameraDistance = 55;

        // タイマー
        this.timer = 0;
        this.timerInterval = null;

        // Three.js シーン
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x060913);

        this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 1000);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.container.appendChild(this.renderer.domElement);

        // ライティング
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        this.scene.add(ambientLight);

        this.dirLight = new THREE.DirectionalLight(0xffeedd, 0.9);
        this.dirLight.position.set(30, 50, 30);
        this.dirLight.castShadow = true;
        this.dirLight.shadow.mapSize.width = 2048;
        this.dirLight.shadow.mapSize.height = 2048;
        const shadowD = 22;
        this.dirLight.shadow.camera.left = -shadowD;
        this.dirLight.shadow.camera.right = shadowD;
        this.dirLight.shadow.camera.top = shadowD;
        this.dirLight.shadow.camera.bottom = -shadowD;
        this.scene.add(this.dirLight);

        const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.35);
        fillLight.position.set(-30, 20, -30);
        this.scene.add(fillLight);

        // レイキャスター
        this.raycaster = new THREE.Raycaster();
        this.mouse = new THREE.Vector2();

        // ジオメトリ（谷間を見渡せる高さ2/3 = 0.64）
        this.boxGeometry = new THREE.BoxGeometry(0.96, 0.64, 0.96);

        // 選択ホバー枠
        const hoverGeo = new THREE.BoxGeometry(1.02, 0.70, 1.02);
        const hoverMat = new THREE.MeshBasicMaterial({ color: 0xfef08a, wireframe: true, transparent: true, opacity: 0.9 });
        this.hoverBox = new THREE.Mesh(hoverGeo, hoverMat);
        this.hoverBox.visible = false;
        this.scene.add(this.hoverBox);

        // 🌟 3D空間26近傍の感知範囲ハイライトプール（最大26個） 🌟
        this.neighborHighlighters = [];
        const nGeo = new THREE.BoxGeometry(1.01, 0.68, 1.01);
        const nMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.65 });
        for (let i = 0; i < 26; i++) {
          const m = new THREE.Mesh(nGeo, nMat);
          m.visible = false;
          this.scene.add(m);
          this.neighborHighlighters.push(m);
        }

        // 初期化
        this.updateCameraProjection();
        this.updateCameraTransform();
        this.initEvents();
        this.resetGame();
        this.animate();
      }
      updateCameraProjection() {
        this.width = this.container.clientWidth || window.innerWidth;
        this.height = this.container.clientHeight || window.innerHeight;
        const aspect = this.width / this.height;

        const maxExtent = this.gridSize * 1.45 + this.maxHeight * 0.72 + 2.0;
        let viewWidth, viewHeight;
        if (aspect < 1.0) {
          viewWidth = (maxExtent * 1.18) / this.zoomFactor;
          viewHeight = viewWidth / aspect;
        } else {
          viewHeight = (maxExtent * 1.22) / this.zoomFactor;
          viewWidth = viewHeight * aspect;
        }

        this.camera.left = -viewWidth / 2;
        this.camera.right = viewWidth / 2;
        this.camera.top = viewHeight / 2;
        this.camera.bottom = -viewHeight / 2;
        this.camera.updateProjectionMatrix();

        if (this.renderer) {
          this.renderer.setSize(this.width, this.height);
        }
      }

      setZoom(delta, absolute = false) {
        if (absolute) {
          this.zoomFactor = delta;
        } else {
          this.zoomFactor = Math.max(0.6, Math.min(2.8, this.zoomFactor + delta));
        }
        const zoomLabel = document.getElementById('btn-zoom-reset');
        if (zoomLabel) {
          zoomLabel.innerText = `${Math.round(this.zoomFactor * 10) / 10}x`;
        }
        this.updateCameraProjection();
      }

      updateCameraTransform() {
        const pitch = this.pitchAngles[this.pitchIndex].pitch;
        const radius = this.cameraDistance;
        this.camera.position.x = radius * Math.cos(pitch) * Math.sin(this.currentRotationY);
        this.camera.position.y = radius * Math.sin(pitch);
        this.camera.position.z = radius * Math.cos(pitch) * Math.cos(this.currentRotationY);
        this.camera.lookAt(0, -0.2, 0);
      }

      cyclePitchAngle() {
        sfx.playRotate();
        this.pitchIndex = (this.pitchIndex + 1) % this.pitchAngles.length;
        const pObj = this.pitchAngles[this.pitchIndex];
        const label = document.getElementById('pitch-label');
        if (label) label.innerText = pObj.name;
        this.updateCameraTransform();
      }

      toggleXRay() {
        this.isXRayActive = !this.isXRayActive;
        const label = document.getElementById('xray-label');
        const btn = document.getElementById('btn-xray');
        if (this.isXRayActive) {
          if (label) label.innerText = '透視 ON';
          if (btn) btn.className = 'px-2 py-1 bg-purple-600 active:scale-95 text-white font-bold rounded-lg transition-all flex items-center gap-1 border border-purple-400 shadow';
        } else {
          if (label) label.innerText = '透視 OFF';
          if (btn) btn.className = 'px-2 py-1 bg-slate-800 hover:bg-slate-700 active:scale-95 text-purple-300 font-bold rounded-lg transition-all flex items-center gap-1 border border-slate-700';
        }

        // 透視マテリアル透過度の適用
        this.activeBlocks.forEach(b => {
          this.updateBlockMaterials(b);
        });
      }

      // プロシージャル地形生成（単独峰、稜線、双子峰、カルデラなど毎回変化）
      generateProceduralHeights(size, maxH) {
        const map = [];
        const terrainTypes = ['mountain', 'ridge', 'twin_peaks', 'caldera', 'terrace'];
        const type = terrainTypes[Math.floor(Math.random() * terrainTypes.length)];
        const phaseX = Math.random() * 10;
        const phaseZ = Math.random() * 10;

        for (let x = 0; x < size; x++) {
          map[x] = [];
          for (let z = 0; z < size; z++) {
            const nx = (x / (size - 1)) * 2 - 1;
            const nz = (z / (size - 1)) * 2 - 1;
            const dist = Math.hypot(nx, nz);
            let hRatio = 0;

            if (type === 'mountain') {
              hRatio = Math.max(0, 1 - dist * 1.15);
            } else if (type === 'ridge') {
              hRatio = Math.max(0, 1 - Math.abs(nx + nz * 0.5) * 1.2);
            } else if (type === 'twin_peaks') {
              const d1 = Math.hypot(nx - 0.45, nz - 0.45);
              const d2 = Math.hypot(nx + 0.45, nz + 0.45);
              hRatio = Math.max(0, Math.max(1 - d1 * 1.4, 1 - d2 * 1.4));
            } else if (type === 'caldera') {
              hRatio = Math.sin(dist * Math.PI) * 0.9;
            } else {
              hRatio = Math.max(0, 1 - dist) + 0.2;
            }

            const noise = Math.sin(x * 1.2 + phaseX) * Math.cos(z * 1.2 + phaseZ) * 0.35;
            let rawHeight = Math.round(1 + (hRatio + noise) * (maxH - 1));
            rawHeight = Math.max(1, Math.min(maxH, rawHeight));
            map[x][z] = rawHeight;
          }
        }
        return map;
      }
      /* 🌟 露出面（外気に触れている面）の検出 🌟 */
      getExposedFaces(x, y, z, heightMap) {
        const size = this.gridSize;
        const isOccupied = (tx, ty, tz) => {
          if (tx < 0 || tx >= size || tz < 0 || tz >= size) return false;
          return ty < heightMap[tx][tz];
        };

        return {
          px: !isOccupied(x + 1, y, z), // 右
          nx: !isOccupied(x - 1, y, z), // 左
          py: !isOccupied(x, y + 1, z), // 上
          ny: y > 0 && !isOccupied(x, y - 1, z), // 下
          pz: !isOccupied(x, y, z + 1), // 前
          nz: !isOccupied(x, y, z - 1)  // 後
        };
      }

      /* 🌟 ブロックの全露出面にテクスチャを一括反映する中核メソッド 🌟 */
      updateBlockMaterials(block) {
        const exposed = block.exposedFaces;
        const opacity = this.isXRayActive ? 0.45 : 1.0;
        const transparent = this.isXRayActive;

        let targetTex = null;
        if (block.revealed) {
          targetTex = getNumberTexture(block.neighborMines);
        } else if (block.flagged) {
          if (this.isGameOver) {
            targetTex = block.isMine ? getCorrectFlagTexture() : getWrongFlagTexture();
          } else {
            targetTex = getFlagTexture();
          }
        } else if (this.isGameOver && block.isMine) {
          targetTex = getBombTexture(block.isExploded);
        }

        const materials = [];
        const faces = ['px', 'nx', 'py', 'ny', 'pz', 'nz'];

        for (let i = 0; i < 6; i++) {
          const faceKey = faces[i];
          const isFaceExposed = exposed[faceKey];

          if (targetTex && isFaceExposed) {
            // 🌟 露出している全方位に同じテクスチャ（数字・旗・爆弾）を投影 🌟
            materials.push(new THREE.MeshLambertMaterial({
              map: targetTex,
              transparent: transparent,
              opacity: opacity
            }));
          } else if (block.revealed) {
            materials.push(new THREE.MeshLambertMaterial({
              color: 0x1f2937,
              transparent: transparent,
              opacity: opacity
            }));
          } else {
            // 未開封状態
            if (faceKey === 'py') {
              materials.push(new THREE.MeshLambertMaterial({
                map: getUnrevealedTopTexture(),
                transparent: transparent,
                opacity: opacity
              }));
            } else {
              materials.push(new THREE.MeshLambertMaterial({
                map: getUnrevealedSideTexture(),
                transparent: transparent,
                opacity: opacity
              }));
            }
          }
        }

        block.mesh.material = materials;
        block.mesh.material.needsUpdate = true;
      }
      // 3Dポールフラグの生成・破棄
      createFlagPinMesh() {
        const group = new THREE.Group();
        // 金色のポール
        const poleGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.5, 8);
        const poleMat = new THREE.MeshLambertMaterial({ color: 0xf59e0b });
        const pole = new THREE.Mesh(poleGeo, poleMat);
        pole.position.y = 0.25;
        group.add(pole);

        // 赤い三角フラッグペナント
        const flagGeo = new THREE.ConeGeometry(0.18, 0.32, 3);
        const flagMat = new THREE.MeshLambertMaterial({ color: 0xef4444 });
        const flag = new THREE.Mesh(flagGeo, flagMat);
        flag.rotation.z = Math.PI / 2;
        flag.rotation.y = Math.PI / 2;
        flag.position.set(0.12, 0.36, 0);
        group.add(flag);

        group.position.y = 0.32;
        return group;
      }

      /* ゲームリセット / 再構築 */
      resetGame() {
        clearInterval(this.timerInterval);
        this.timer = 0;
        this.timerInterval = null;
        this.updateTimerDisplay();

        this.isFirstClick = true;
        this.isGameOver = false;
        this.isGameWon = false;
        this.flagsPlaced = 0;
        this.revealedCount = 0;
        this.hoverBox.visible = false;
        this.hideNeighborHighlights();

        // 既存メッシュ削除
        this.allMeshes.forEach(mesh => this.scene.remove(mesh));
        this.allMeshes = [];
        this.activeBlocks = [];
        this.board = [];

        const heightMap = this.generateProceduralHeights(this.gridSize, this.maxHeight);
        const offsetX = (this.gridSize - 1) / 2;
        const offsetZ = (this.gridSize - 1) / 2;
        const baseHeightOffset = ((this.maxHeight - 1) * 0.64) / 2;

        for (let x = 0; x < this.gridSize; x++) {
          this.board[x] = [];
          for (let y = 0; y < this.maxHeight; y++) {
            this.board[x][y] = [];
            for (let z = 0; z < this.gridSize; z++) {
              if (y < heightMap[x][z]) {
                const exposed = this.getExposedFaces(x, y, z, heightMap);
                const hasExposedFace = exposed.px || exposed.nx || exposed.py || exposed.pz || exposed.nz;

                // メッシュ作成
                const mesh = new THREE.Mesh(this.boxGeometry, []);
                mesh.position.set(x - offsetX, y * 0.64 - baseHeightOffset, z - offsetZ);
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                // 輪郭エッジライン（黒い境界線）の付与
                const edgeGeo = new THREE.EdgesGeometry(this.boxGeometry);
                const edgeMat = new THREE.LineBasicMaterial({ color: 0x050505, linewidth: 1 });
                const wireframe = new THREE.LineSegments(edgeGeo, edgeMat);
                mesh.add(wireframe);

                const blockData = {
                  x, y, z,
                  isMine: false,
                  revealed: false,
                  flagged: false,
                  isExploded: false,
                  neighborMines: 0,
                  mesh: mesh,
                  flagPin: null,
                  exposedFaces: exposed,
                  isActive: hasExposedFace
                };

                mesh.userData = blockData;
                this.updateBlockMaterials(blockData);

                this.scene.add(mesh);
                this.allMeshes.push(mesh);
                this.board[x][y][z] = blockData;

                if (hasExposedFace) {
                  this.activeBlocks.push(blockData);
                }
              } else {
                this.board[x][y][z] = null;
              }
            }
          }
        }

        // 地雷数の設定
        this.activeMines = Math.min(this.activeMines, Math.floor(this.activeBlocks.length * 0.35));
        this.totalSafeBlocks = this.activeBlocks.length - this.activeMines;
        this.updateMineCounter();

        // 視野・モーダルリセット
        this.updateCameraProjection();

        const modal = document.getElementById('game-modal');
        modal.classList.add('opacity-0', 'pointer-events-none');
        document.getElementById('modal-box').classList.add('scale-95');

        const banner = document.getElementById('observe-banner');
        banner.classList.add('opacity-0', '-translate-y-4');
        banner.classList.remove('opacity-100', 'translate-y-0');
      }
      /* 🌟 3次元26近傍の隣接アクティブブロック取得 🌟 */
      get3DNeighbors(block) {
        const neighbors = [];
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            for (let dz = -1; dz <= 1; dz++) {
              if (dx === 0 && dy === 0 && dz === 0) continue;
              const nx = block.x + dx;
              const ny = block.y + dy;
              const nz = block.z + dz;

              if (
                nx >= 0 && nx < this.gridSize &&
                ny >= 0 && ny < this.maxHeight &&
                nz >= 0 && nz < this.gridSize
              ) {
                const n = this.board[nx][ny][nz];
                if (n && n.isActive) {
                  neighbors.push(n);
                }
              }
            }
          }
        }
        return neighbors;
      }

      /* 初回クリック後の地雷配置 (初手＆その周囲を100%保証) */
      populateMines(firstClickedBlock) {
        const safeNeighbors = this.get3DNeighbors(firstClickedBlock);
        const forbidden = new Set();
        forbidden.add(`${firstClickedBlock.x},${firstClickedBlock.y},${firstClickedBlock.z}`);
        safeNeighbors.forEach(n => forbidden.add(`${n.x},${n.y},${n.z}`));

        const candidates = this.activeBlocks.filter(b => !forbidden.has(`${b.x},${b.y},${b.z}`));
        // シャッフル
        for (let i = candidates.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
        }

        const countToPlace = Math.min(this.activeMines, candidates.length);
        for (let i = 0; i < countToPlace; i++) {
          candidates[i].isMine = true;
        }

        // 全アクティブブロックの26近傍地雷数を計算
        this.activeBlocks.forEach(b => {
          if (b.isMine) return;
          const neighbors = this.get3DNeighbors(b);
          b.neighborMines = neighbors.filter(n => n.isMine).length;
        });

        this.startTimer();
      }

      startTimer() {
        if (this.timerInterval) return;
        this.timer = 0;
        this.timerInterval = setInterval(() => {
          this.timer++;
          this.updateTimerDisplay();
        }, 1000);
      }

      updateTimerDisplay() {
        const mins = String(Math.floor(this.timer / 60)).padStart(2, '0');
        const secs = String(this.timer % 60).padStart(2, '0');
        document.getElementById('timer-display').innerText = `${mins}:${secs}`;
      }

      updateMineCounter() {
        const remaining = this.activeMines - this.flagsPlaced;
        const displayEl = document.getElementById('mine-counter');
        displayEl.innerText = remaining < 0 ? `-${String(Math.abs(remaining)).padStart(2, '0')}` : String(remaining).padStart(2, '0');
      }
      /* ブロックを掘る（調査） */
      revealCell(block) {
        if (!block || !block.isActive || block.revealed || block.flagged || this.isGameOver) return;

        if (this.isFirstClick) {
          this.isFirstClick = false;
          this.populateMines(block);
        }

        if (block.isMine) {
          block.isExploded = true;
          this.gameOver(block);
          return;
        }

        block.revealed = true;
        this.revealedCount++;
        sfx.playDig();

        // テクスチャ全露出面に反映
        this.updateBlockMaterials(block);
        block.mesh.scale.set(0.93, 0.93, 0.93);

        // 周囲0マスの場合は3次元連鎖開放（フラッドフィル）
        if (block.neighborMines === 0) {
          const neighbors = this.get3DNeighbors(block);
          neighbors.forEach(neighbor => {
            if (!neighbor.revealed && !neighbor.flagged) {
              this.revealCell(neighbor);
            }
          });
        }

        // 勝利判定
        if (this.revealedCount >= this.totalSafeBlocks) {
          this.gameVictory();
        }
      }

      /* コード操作（開封済みマスをタップした時の周囲一括オープン） */
      chordCell(block) {
        if (!block || !block.revealed || block.neighborMines === 0 || this.isGameOver) return;
        const neighbors = this.get3DNeighbors(block);
        const flaggedCount = neighbors.filter(n => n.flagged).length;

        if (flaggedCount === block.neighborMines) {
          neighbors.forEach(n => {
            if (!n.revealed && !n.flagged) {
              this.revealCell(n);
            }
          });
        }
      }

      /* フラグ切り替え */
      toggleFlag(block) {
        if (!block || !block.isActive || block.revealed || this.isGameOver) return;
        sfx.playFlag();

        block.flagged = !block.flagged;
        if (block.flagged) {
          this.flagsPlaced++;
          if (!block.flagPin) {
            block.flagPin = this.createFlagPinMesh();
            block.mesh.add(block.flagPin);
          }
        } else {
          this.flagsPlaced--;
          if (block.flagPin) {
            block.mesh.remove(block.flagPin);
            block.flagPin = null;
          }
        }

        this.updateBlockMaterials(block);
        this.updateMineCounter();
      }

      /* 感知範囲ハイライト（青い枠線） */
      showNeighborHighlights(block) {
        const neighbors = this.get3DNeighbors(block);
        this.hideNeighborHighlights();
        neighbors.forEach((n, idx) => {
          if (idx < this.neighborHighlighters.length) {
            const h = this.neighborHighlighters[idx];
            h.position.copy(n.mesh.position);
            h.visible = true;
          }
        });
      }

      hideNeighborHighlights() {
        this.neighborHighlighters.forEach(h => h.visible = false);
      }
      /* ゲームオーバー処理（全地雷・誤フラグ・正解フラグ完全開示） */
      gameOver(explodedBlock) {
        this.isGameOver = true;
        clearInterval(this.timerInterval);
        sfx.playExplode();
        this.hideNeighborHighlights();

        let correctCount = 0;
        let wrongCount = 0;

        this.activeBlocks.forEach(b => {
          if (b.flagged) {
            if (b.isMine) correctCount++;
            else wrongCount++;
          }
          this.updateBlockMaterials(b);
          if (b === explodedBlock) {
            b.mesh.scale.set(1.15, 1.15, 1.15);
          }
        });

        setTimeout(() => {
          this.showModal(false, correctCount, wrongCount);
        }, 850);
      }

      /* 勝利処理 */
      gameVictory() {
        this.isGameOver = true;
        this.isGameWon = true;
        clearInterval(this.timerInterval);
        sfx.playWin();
        this.hideNeighborHighlights();

        this.activeBlocks.forEach(b => {
          if (b.isMine && !b.flagged) {
            b.flagged = true;
            if (!b.flagPin) {
              b.flagPin = this.createFlagPinMesh();
              b.mesh.add(b.flagPin);
            }
          }
          this.updateBlockMaterials(b);
        });

        this.flagsPlaced = this.activeMines;
        this.updateMineCounter();

        setTimeout(() => {
          this.showModal(true, this.activeMines, 0);
        }, 600);
      }

      showModal(isWin, correctFlags, wrongFlags) {
        const modal = document.getElementById('game-modal');
        const modalBox = document.getElementById('modal-box');
        const icon = document.getElementById('modal-icon');
        const title = document.getElementById('modal-title');
        const desc = document.getElementById('modal-desc');
        const timeEl = document.getElementById('modal-time');
        const correctEl = document.getElementById('modal-correct-flags');
        const wrongEl = document.getElementById('modal-wrong-flags');

        if (isWin) {
          icon.innerText = '🏆';
          title.innerText = 'TACTICAL CLEAR!';
          title.className = 'text-xl sm:text-2xl font-black text-amber-300 mb-1 font-title';
          desc.innerText = '立体地形の全地雷を暴き、完全制圧を達成しました！';
        } else {
          icon.innerText = '💥';
          title.innerText = 'MISSION FAILED';
          title.className = 'text-xl sm:text-2xl font-black text-rose-500 mb-1 font-title';
          desc.innerText = '地雷が炸裂！盤面観察モードで配置を確認できます。';
        }

        timeEl.innerText = document.getElementById('timer-display').innerText;
        correctEl.innerText = `${correctFlags}/${this.activeMines}`;
        wrongEl.innerText = `${wrongFlags}`;

        modal.classList.remove('opacity-0', 'pointer-events-none');
        modalBox.classList.remove('scale-95');
      }

      hideModalToObserve() {
        const modal = document.getElementById('game-modal');
        const modalBox = document.getElementById('modal-box');
        const banner = document.getElementById('observe-banner');

        modal.classList.add('opacity-0', 'pointer-events-none');
        modalBox.classList.add('scale-95');

        banner.classList.remove('opacity-0', '-translate-y-4');
        banner.classList.add('opacity-100', 'translate-y-0');
      }

      showModalFromObserve() {
        const modal = document.getElementById('game-modal');
        const modalBox = document.getElementById('modal-box');
        const banner = document.getElementById('observe-banner');

        banner.classList.add('opacity-0', '-translate-y-4');
        banner.classList.remove('opacity-100', 'translate-y-0');

        modal.classList.remove('opacity-0', 'pointer-events-none');
        modalBox.classList.remove('scale-95');
      }

      rotateCamera(direction) {
        sfx.playRotate();
        this.targetRotationY += (direction * Math.PI) / 2;
      }
      /* 🌟 入力イベントの初期化 🌟 */
      initEvents() {
        window.addEventListener('resize', () => {
          this.updateCameraProjection();
        });
        window.addEventListener('orientationchange', () => {
          setTimeout(() => this.updateCameraProjection(), 120);
        });

        // ポインターホバー
        const getCellFromClientPos = (clientX, clientY) => {
          const rect = this.renderer.domElement.getBoundingClientRect();
          this.mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
          this.mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

          this.raycaster.setFromCamera(this.mouse, this.camera);
          const candidateMeshes = this.activeBlocks.map(b => b.mesh);
          const intersects = this.raycaster.intersectObjects(candidateMeshes, false);

          if (intersects.length > 0) {
            // 未開封マスを最優先
            const unrevealedHit = intersects.find(hit => !hit.object.userData.revealed);
            return unrevealedHit ? unrevealedHit.object.userData : intersects[0].object.userData;
          }
          return null;
        };

        window.addEventListener('pointermove', (e) => {
          if (this.isGameOver) {
            this.hoverBox.visible = false;
            return;
          }
          const cell = getCellFromClientPos(e.clientX, e.clientY);
          if (cell) {
            this.hoverBox.position.copy(cell.mesh.position);
            this.hoverBox.visible = true;
            this.showNeighborHighlights(cell);
          } else {
            this.hoverBox.visible = false;
            this.hideNeighborHighlights();
          }
        });

        // PC クリック処理
        this.renderer.domElement.addEventListener('click', (e) => {
          const cell = getCellFromClientPos(e.clientX, e.clientY);
          if (!cell) return;

          if (this.currentMode === 'flag') {
            this.toggleFlag(cell);
          } else {
            if (cell.revealed) {
              this.chordCell(cell);
            } else {
              this.revealCell(cell);
            }
          }
        });

        // PC 右クリック即フラグ
        this.renderer.domElement.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          const cell = getCellFromClientPos(e.clientX, e.clientY);
          if (cell) this.toggleFlag(cell);
        });

        // ズーム（マウスホイール）
        this.renderer.domElement.addEventListener('wheel', (e) => {
          e.preventDefault();
          const delta = e.deltaY < 0 ? 0.15 : -0.15;
          this.setZoom(delta);
        }, { passive: false });

        // タッチ＆長押し＆スワイプ＆ピンチズーム
        let touchStartX = 0;
        let touchStartY = 0;
        let isTouchMoved = false;
        let longPressTimer = null;
        let isLongPressTriggered = false;
        let initialPinchDist = 0;
        let initialPinchZoom = 1.0;

        this.renderer.domElement.addEventListener('touchstart', (e) => {
          if (e.touches.length === 2) {
            if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
            initialPinchDist = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            initialPinchZoom = this.zoomFactor;
            return;
          }

          if (e.touches.length === 1) {
            const t = e.touches[0];
            touchStartX = t.clientX;
            touchStartY = t.clientY;
            isTouchMoved = false;
            isLongPressTriggered = false;

            if (longPressTimer) clearTimeout(longPressTimer);
            longPressTimer = setTimeout(() => {
              if (!isTouchMoved && !this.isGameOver) {
                const targetCell = getCellFromClientPos(touchStartX, touchStartY);
                if (targetCell) {
                  isLongPressTriggered = true;
                  if (navigator.vibrate) navigator.vibrate(40);
                  this.toggleFlag(targetCell);
                }
              }
            }, 360);
          }
        }, { passive: true });

        this.renderer.domElement.addEventListener('touchmove', (e) => {
          if (e.touches.length === 2) {
            const dist = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            if (initialPinchDist > 0) {
              const scale = dist / initialPinchDist;
              this.setZoom(initialPinchZoom * scale, true);
            }
            return;
          }

          if (e.touches.length === 1) {
            const dist = Math.hypot(e.touches[0].clientX - touchStartX, e.touches[0].clientY - touchStartY);
            if (dist > 20) {
              isTouchMoved = true;
              if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
            }
          }
        }, { passive: true });

        this.renderer.domElement.addEventListener('touchend', (e) => {
          if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
          if (isLongPressTriggered) return;

          if (e.changedTouches.length === 1 && isTouchMoved) {
            const deltaX = e.changedTouches[0].clientX - touchStartX;
            const deltaY = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(deltaX) > 45 && Math.abs(deltaY) < 60) {
              this.rotateCamera(deltaX > 0 ? -1 : 1);
            }
          }
        }, { passive: true });

        // UI ボタン操作
        const btnDig = document.getElementById('btn-mode-dig');
        const btnFlag = document.getElementById('btn-mode-flag');

        btnDig.addEventListener('click', () => {
          this.currentMode = 'dig';
          btnDig.className = 'flex-1 py-2 px-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1 transition-all shadow-lg ring-2 ring-emerald-500 bg-emerald-600 text-white';
          btnFlag.className = 'flex-1 py-2 px-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1 transition-all bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700';
        });

        btnFlag.addEventListener('click', () => {
          this.currentMode = 'flag';
          btnFlag.className = 'flex-1 py-2 px-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1 transition-all shadow-lg ring-2 ring-rose-500 bg-rose-600 text-white';
          btnDig.className = 'flex-1 py-2 px-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1 transition-all bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700';
        });

        // 俯瞰アングル・透視
        document.getElementById('btn-pitch').addEventListener('click', () => this.cyclePitchAngle());
        document.getElementById('btn-xray').addEventListener('click', () => this.toggleXRay());

        // ズーム
        document.getElementById('btn-zoom-in').addEventListener('click', () => this.setZoom(0.25));
        document.getElementById('btn-zoom-out').addEventListener('click', () => this.setZoom(-0.25));
        document.getElementById('btn-zoom-reset').addEventListener('click', () => this.setZoom(1.0, true));

        // 旋回
        document.getElementById('btn-rot-left').addEventListener('click', () => this.rotateCamera(-1));
        document.getElementById('btn-rot-right').addEventListener('click', () => this.rotateCamera(1));

        // リセット / 観察モード
        document.getElementById('btn-reset').addEventListener('click', () => this.resetGame());
        document.getElementById('modal-restart-btn').addEventListener('click', () => this.resetGame());
        document.getElementById('modal-observe-btn').addEventListener('click', () => this.hideModalToObserve());
        document.getElementById('btn-return-modal').addEventListener('click', () => this.showModalFromObserve());

        // 難易度切り替え
        document.querySelectorAll('.diff-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.diff-btn').forEach(b => {
              b.classList.remove('text-amber-400');
              b.classList.add('text-slate-400');
            });
            btn.classList.remove('text-slate-400');
            btn.classList.add('text-amber-400');

            this.gridSize = parseInt(btn.dataset.size);
            this.maxHeight = parseInt(btn.dataset.height);
            this.activeMines = parseInt(btn.dataset.mines);
            this.resetGame();
          });
        });

        // キーボードショートカット
        window.addEventListener('keydown', (e) => {
          if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') this.rotateCamera(-1);
          else if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') this.rotateCamera(1);
          else if (e.key === 'p' || e.key === 'P' || e.key === 'ArrowUp' || e.key === 'ArrowDown') this.cyclePitchAngle();
          else if (e.key === 'x' || e.key === 'X') this.toggleXRay();
          else if (e.key === ' ' || e.key === 'f' || e.key === 'F') {
            if (this.currentMode === 'dig') btnFlag.click();
            else btnDig.click();
          }
        });
      }
      /* メインレンダリングループ */
      animate() {
        requestAnimationFrame(() => this.animate());

        // スムーズなカメラ旋回補間
        const diff = this.targetRotationY - this.currentRotationY;
        if (Math.abs(diff) > 0.001) {
          this.currentRotationY += diff * 0.14;
          this.updateCameraTransform();
        }

        this.renderer.render(this.scene, this.camera);
      }
    }

    // DOMロード後にゲーム起動
    window.addEventListener('DOMContentLoaded', () => {
      window.game = new VoxelMinesweeperGame();
    });
  </script>
</body>
